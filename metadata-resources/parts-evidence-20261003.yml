name: DJI Drone Parts Evidence Worksheet
description: >-
  An openly licensed worksheet for higher-education electronics, maintenance
  and procurement learners. It distinguishes parts provenance from compatibility,
  provides an eight-check exact-item evidence table, two clearly hypothetical
  classroom cases with sample answers, and a documented sourcing-request exercise.
  It teaches evidence review, not installation, flight approval or certification.
